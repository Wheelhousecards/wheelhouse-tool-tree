<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wheelhouse Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =========================================================
   EDIT HERE — the only two things you should need to change
   (they're in the <script> at the bottom of this file):
   1. MANAGER_PIN  – your unlock code
   2. LINKS        – the list of tools
   ========================================================= */
:root{
  --bg:#0d1117; --panel:#161b22; --panel-hover:#1c2330; --border:#2a3240;
  --text:#e8ecf2; --muted:#8b96a8; --accent:#f2b134; --accent-ink:#1a1300;
  --live:#3fb950; --wip:#f2b134; --stripe:#2a2410;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:48px 16px 32px}
.wrap{width:100%;max-width:520px}
header{text-align:center;margin-bottom:32px}
.logo{width:64px;height:64px;border-radius:50%;margin:0 auto 14px;background:var(--accent);
  display:grid;place-items:center;color:var(--accent-ink);font-family:"Barlow Condensed",sans-serif;
  font-weight:700;font-size:30px;letter-spacing:.5px}
h1{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:34px;letter-spacing:1.5px;
  text-transform:uppercase;margin:0}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.mgr-banner{display:none;margin:0 0 16px;padding:10px 14px;border-radius:10px;font-size:13px;
  background:var(--stripe);border:1px solid #4a3b12;color:var(--accent);text-align:center}
body.unlocked .mgr-banner{display:block}
.list{display:flex;flex-direction:column;gap:12px}
.tile{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:14px;
  background:var(--panel);border:1px solid var(--border);color:inherit;text-decoration:none;
  cursor:pointer;transition:background .15s,transform .15s,border-color .15s;width:100%;
  font:inherit;text-align:left}
.tile:hover{background:var(--panel-hover);border-color:#3a4558;transform:translateY(-1px)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon{flex:none;width:42px;height:42px;border-radius:10px;background:#212937;display:grid;place-items:center}
.icon svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.body{flex:1;min-width:0}
.name{font-weight:600;font-size:16px}
.desc{color:var(--muted);font-size:13px;margin-top:2px}
.badge{flex:none;font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;
  padding:4px 8px;border-radius:999px}
.badge.live{display:none}
.badge.wip{background:var(--stripe);color:var(--wip);border:1px solid #4a3b12}
.tile.wip{background:repeating-linear-gradient(135deg,var(--panel) 0 14px,#191c1f 14px 28px)}
.tile.wip .icon svg{stroke:var(--muted)}
body.unlocked .tile.wip .icon svg{stroke:var(--accent)}
footer{margin-top:36px;text-align:center;color:var(--muted);font-size:12px}
footer button{background:none;border:none;color:var(--muted);font:inherit;cursor:pointer;
  text-decoration:underline;text-underline-offset:3px;padding:4px}
footer button:hover{color:var(--text)}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;
  justify-content:center;padding:16px;z-index:10}
.overlay.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:28px 24px;
  width:100%;max-width:380px;text-align:center}
.cone{font-size:40px;line-height:1;margin-bottom:10px}
.modal h2{font-family:"Barlow Condensed",sans-serif;font-size:26px;letter-spacing:1px;
  text-transform:uppercase;margin:0 0 6px}
.modal p{color:var(--muted);font-size:14px;margin:0 0 18px;line-height:1.5}
.modal input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);font:inherit;font-size:18px;text-align:center;letter-spacing:6px}
.modal input:focus{outline:2px solid var(--accent);border-color:transparent}
.err{color:#f85149;font-size:13px;min-height:18px;margin:8px 0 4px}
.row{display:flex;gap:10px;margin-top:8px}
.btn{flex:1;padding:11px;border-radius:10px;border:1px solid var(--border);background:transparent;
  color:var(--text);font:inherit;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.link-btn{background:none;border:none;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;
  text-decoration:underline;text-underline-offset:3px;margin-top:14px}
@media (max-width:420px){ h1{font-size:28px} .tile{padding:14px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">W</div>
    <h1>Wheelhouse Tools</h1>
    <div class="sub">Everything the team uses, in one place</div>
  </header>

  <div class="mgr-banner">Manager view — in-progress tools are unlocked on this device</div>
  <nav class="list" id="list"></nav>

  <footer>
    <button id="mgrBtn" type="button">Manager access</button>
  </footer>
</div>

<!-- Under construction modal -->
<div class="overlay" id="ucModal" role="dialog" aria-modal="true" aria-labelledby="ucTitle">
  <div class="modal">
    <div class="cone">🚧</div>
    <h2 id="ucTitle">Under Construction</h2>
    <p><strong id="ucName"></strong> is still being built and isn't ready for the team yet. Check back soon.</p>
    <div class="row"><button class="btn primary" data-close>Got it</button></div>
    <button class="link-btn" id="ucToPin" type="button">Manager access</button>
  </div>
</div>

<!-- PIN modal -->
<div class="overlay" id="pinModal" role="dialog" aria-modal="true" aria-labelledby="pinTitle">
  <div class="modal">
    <h2 id="pinTitle">Manager Access</h2>
    <p>Enter your PIN to open in-progress tools on this device.</p>
    <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" maxlength="12" aria-label="PIN">
    <div class="err" id="pinErr"></div>
    <div class="row">
      <button class="btn" data-close>Cancel</button>
      <button class="btn primary" id="pinGo">Unlock</button>
    </div>
  </div>
</div>

<script>
/* ===================== EDIT BELOW ===================== */

// Your unlock code. Change this before publishing.
const MANAGER_PIN = "1175";

// status: "live" = everyone can open it
//         "wip"  = shows Under Construction unless unlocked with the PIN
// To launch a tool, change its status from "wip" to "live".
const LINKS = [
  { name: "Wheel Wax",             desc: "Wax inventory & aging",            icon: "box",      status: "live",
    url: "https://wheelhouse-wax-aging.vercel.app/#inventory" },
  { name: "Breaks Scheduling",     desc: "Book and manage break rooms",      icon: "video",    status: "live",
    url: "https://wheelhousejt.github.io/wheelhouse-breaks-schedule/" },
  { name: "In-Store Scheduling",   desc: "Staff shifts by week & store",     icon: "calendar", status: "live",
    url: "https://wheelhousejt.github.io/gusto-schedule/" },
  { name: "Inquiry Board",         desc: "Customer calls, emails & Square",  icon: "phone",    status: "wip",
    url: "https://wheelhousejt.github.io/phone-board/" },
  { name: "Consignment Tracking",  desc: "Track consigned items",            icon: "tag",      status: "wip",
    url: "https://wheelhousecards.github.io/staff.html" },
];

/* ================= NO NEED TO EDIT BELOW ================= */
const ICONS = {
  box:'<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',
  video:'<rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3z"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
  phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
  tag:'<path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><circle cx="7" cy="7" r="1.5"/>',
  link:'<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>'
};
const KEY = "wh_tools_unlocked";
const store = {
  get(){ try { return localStorage.getItem(KEY) === "1"; } catch(e){ return false; } },
  set(v){ try { v ? localStorage.setItem(KEY,"1") : localStorage.removeItem(KEY); } catch(e){} }
};
let unlocked = store.get();

const list = document.getElementById("list");
const ucModal = document.getElementById("ucModal");
const pinModal = document.getElementById("pinModal");
const pinInput = document.getElementById("pinInput");
const pinErr = document.getElementById("pinErr");
const mgrBtn = document.getElementById("mgrBtn");

function render(){
  document.body.classList.toggle("unlocked", unlocked);
  mgrBtn.textContent = unlocked ? "Lock manager access" : "Manager access";
  list.innerHTML = "";
  LINKS.forEach(l => {
    const wip = l.status === "wip";
    const open = !wip || unlocked;
    const el = document.createElement(open ? "a" : "button");
    el.className = "tile" + (wip ? " wip" : "");
    if (open) { el.href = l.url; el.target = "_blank"; el.rel = "noopener"; }
    else { el.type = "button"; el.addEventListener("click", () => showUC(l.name)); }
    el.innerHTML =
      `<div class="icon"><svg viewBox="0 0 24 24">${ICONS[l.icon] || ICONS.link}</svg></div>
       <div class="body"><div class="name"></div><div class="desc"></div></div>
       <span class="badge ${wip ? "wip" : "live"}">${wip ? (unlocked ? "In progress" : "Coming soon") : ""}</span>`;
    el.querySelector(".name").textContent = l.name;
    el.querySelector(".desc").textContent = l.desc || "";
    list.appendChild(el);
  });
}

function openModal(m){ m.classList.add("open"); }
function closeModals(){ [ucModal,pinModal].forEach(m => m.classList.remove("open")); pinErr.textContent=""; pinInput.value=""; }
function showUC(name){ document.getElementById("ucName").textContent = name; openModal(ucModal); }
function showPin(){ closeModals(); openModal(pinModal); setTimeout(() => pinInput.focus(), 50); }

function tryPin(){
  if (pinInput.value.trim() === MANAGER_PIN) { unlocked = true; store.set(true); closeModals(); render(); }
  else { pinErr.textContent = "Wrong PIN"; pinInput.select(); }
}

mgrBtn.addEventListener("click", () => {
  if (unlocked) { unlocked = false; store.set(false); render(); } else showPin();
});
document.getElementById("ucToPin").addEventListener("click", showPin);
document.getElementById("pinGo").addEventListener("click", tryPin);
pinInput.addEventListener("keydown", e => { if (e.key === "Enter") tryPin(); });
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModals));
[ucModal,pinModal].forEach(m => m.addEventListener("click", e => { if (e.target === m) closeModals(); }));
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModals(); });

render();
</script>
</body>
</html>
